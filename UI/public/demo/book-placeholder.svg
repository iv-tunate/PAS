<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A5C" />
      <stop offset="100%" stop-color="#14171C" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" />

  <!-- closed book, front cover + spine -->
  <g transform="translate(300,400)" opacity="0.85">
    <rect x="-110" y="-160" width="220" height="320" rx="6" fill="none" stroke="#F6F1E7" stroke-opacity="0.5" stroke-width="3" />
    <line x1="-80" y1="-160" x2="-80" y2="160" stroke="#F6F1E7" stroke-opacity="0.3" stroke-width="2" />
    <line x1="-40" y1="-100" x2="60" y2="-100" stroke="#F6F1E7" stroke-opacity="0.35" stroke-width="2" />
    <line x1="-40" y1="-75" x2="40" y2="-75" stroke="#F6F1E7" stroke-opacity="0.35" stroke-width="2" />
  </g>

  <text x="300" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#8A8578" letter-spacing="1">
    Cover coming soon
  </text>
</svg>
